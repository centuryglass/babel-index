name: dependency-review

# Blocks a PR that introduces a new dependency (direct or transitive) with a
# known vulnerability or a disallowed license - checked against the PR's
# diff, not the whole tree. That's why this can be a real gate where
# `ci.yml`'s `audit` job is informational-only: `audit` reports every
# advisory already in the lockfile, including the unfixable dev/optional-only
# ones noted there, and failing on those would stay red forever for reasons
# unrelated to any given PR. This only ever fires on what a PR actually adds.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
