name: e2e

# The browser smoke test: a merge gate, and still runnable by hand.
#
# `ci.yml` calls this workflow and its aggregate `ci` job will not go green
# without it, so branch protection requires only that one check.
#
# Manual runs pick their own Node version:
#
#   gh workflow run e2e.yml
#   ...or the "Run workflow" button on the Actions tab.
on:
  workflow_call:
    inputs:
      node:
        description: Node version to run against
        type: string
        default: '22'
  workflow_dispatch:
    inputs:
      node:
        description: Node version to run against
        type: choice
        default: '22'
        options: ['20', '22', '24']

permissions:
  contents: read

jobs:
  smoke:
    name: browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node }}
          cache: npm

      - run: npm ci

      # Only Chromium, and only here - the fast `npm test` suite never opens a
      # browser and must not spend a minute downloading one.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      # The test screenshots the final state whether it passed or failed, which
      # is the quickest way to read "the canvas rendered nothing" from a run
      # that happened on a machine you are not sitting at.
      - name: Upload the last frame
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: library-${{ inputs.node }}
          path: packages/web/e2e/artifacts/
          if-no-files-found: warn
