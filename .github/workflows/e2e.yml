name: e2e

# A merge gate, and still runnable by hand.
#
# This used to be manual only, on the grounds that a browser per pull request
# was more machinery than the smoke test earned. That trade changed: the map's
# gestures, its focus handling and - once the accessibility work lands - its
# whole keyboard interface are things only a browser can see, and a minute of
# CI is cheaper than merging a map nobody drove. `ci.yml` calls this workflow
# and will not go green without it, so branch protection still requires exactly
# one check.
#
# Manual runs pick their own Node version:
#
#   gh workflow run e2e.yml
#   ...or the "Run workflow" button on the Actions tab.
on:
  workflow_call:
    inputs:
      node:
        description: Node version to run against
        type: string
        default: '22'
  workflow_dispatch:
    inputs:
      node:
        description: Node version to run against
        type: choice
        default: '22'
        options: ['20', '22', '24']

permissions:
  contents: read

jobs:
  smoke:
    name: browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node }}
          cache: npm

      - run: npm ci

      # Only Chromium, and only here - the fast `npm test` suite never opens a
      # browser and must not spend a minute downloading one.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      # The test screenshots the final state whether it passed or failed, which
      # is the quickest way to read "the canvas rendered nothing" from a run
      # that happened on a machine you are not sitting at.
      - name: Upload the last frame
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: library-${{ inputs.node }}
          path: packages/web/e2e/artifacts/
          if-no-files-found: warn
