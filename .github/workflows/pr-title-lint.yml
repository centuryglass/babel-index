name: pr-title-lint

# The repo squash-merges, so the PR title becomes the commit subject on main
# - the only line release-please.yml reads to decide the next version and
# write CHANGELOG.md. This is what makes a bad title a review-time failure
# instead of a silent gap in the changelog. See AGENTS.md's "The PR
# title is the only release input" and the PR template for the format this enforces.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: read
  statuses: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
