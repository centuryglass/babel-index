name: deploy

# Ship a tagged release to the VPS, and prove it shipped.
#
# Runs after `ci`, on its completion: `workflow_run` carries the sha ci
# tested, so the deploy ships that revision, not whatever main's tip is by
# the time this starts.
#
# Only the push that merges release-please's release PR deploys. The job's
# `if` matches the head commit subject against that PR's title
# (`chore(main): release ...`; release-please.yml's header explains why the
# title becomes the subject). That merge is also where release-please tags
# and writes CHANGELOG.md, so every automatic deploy is a named release.
#
# The deploy is one ssh call to `deploy/deploy.sh`, which the key is pinned
# to as an SSH forced command, so a leaked key can only ask for a revision of
# main. `deploy/README.md` has the one-time setup and failure triage; the
# "authorize the runner" step names any secret it lists that is missing.
#
# A manual dispatch ("Run workflow", with a sha) is the rollback and
# redeploy path, and the one way to ship something other than a release,
# such as an urgent fix. Any sha that has been on main is accepted.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to deploy (default: the tip of main)'
        type: string
        required: false

permissions:
  contents: read

# Never two deploys at once, and never cancel one in flight: a deploy ends in
# a service restart, and a cancelled run leaves the box in a state nobody
# chose. A queued run waits its turn, then deploys over the top.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to production
    # A dispatch always runs. Otherwise the triggering ci run must be a
    # successful push to main whose head commit is release-please's release
    # commit.
    #   - The `event == 'push'` check is required: `workflow_run`'s branch
    #     filter matches the triggering run's head branch, which for a pull
    #     request is the PR's branch, so a fork branch named `main` would pass.
    #     deploy.sh's ancestor-of-origin/main check enforces the same rule on
    #     the far side of the ssh connection.
    #   - The commit-message check keeps an ordinary merge to main from
    #     deploying.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       startsWith(github.event.workflow_run.head_commit.message, 'chore(main): release '))
    runs-on: ubuntu-latest
    # Sized for the parity gate (npm ci, a Chromium install, two browser
    # sessions) plus the ssh call and both health checks.
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}

    steps:
      - name: which commit
        id: target
        env:
          # First non-empty wins: a dispatched sha, else the revision ci just
          # passed, else the tip of the ref a dispatch with no input ran from.
          REQUESTED: ${{ inputs.sha }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
          FALLBACK: ${{ github.sha }}
        run: |
          sha="${REQUESTED:-${TESTED:-$FALLBACK}}"
          # Full shas only. deploy.sh refuses anything else anyway, but
          # failing here costs no ssh connection and says so more clearly.
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::not a full 40-character commit sha: '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deploying $sha"

      # At the revision being deployed, so both `deploy/health-check.mjs` and
      # the parity gate below check the same commit the box is about to run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The render-parity gate: a revision that breaks Canvas2D/WebGL parity
      # (AGENTS.md, "The two renderers are separate implementations kept in
      # lockstep") never reaches production. It boots two browser sessions,
      # too slow to gate every merge, so it gates deploys. It runs on the
      # runner's GPU-less Chromium with software (SwiftShader) WebGL2, as
      # `webgl-map.e2e.ts` does in `e2e.yml`.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: npm run test:parity
        run: npm run test:parity

      - name: authorize the runner
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          missing=()
          [[ -n "$KEY" ]] || missing+=(DEPLOY_SSH_KEY)
          [[ -n "$KNOWN_HOSTS" ]] || missing+=(DEPLOY_KNOWN_HOSTS)
          [[ -n "$SSH_HOST" ]] || missing+=(DEPLOY_HOST)
          [[ -n "$SSH_PORT" ]] || missing+=(DEPLOY_PORT)
          [[ -n "$SSH_USER" ]] || missing+=(DEPLOY_USER)
          [[ -n "$PUBLIC_URL" ]] || missing+=('PUBLIC_URL (a variable, not a secret)')
          if (( ${#missing[@]} )); then
            echo "::error::not configured yet - missing: ${missing[*]}. See deploy/README.md."
            exit 1
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/babel_deploy
          chmod 600 ~/.ssh/babel_deploy
          # Pinned host keys, never trust-on-first-use: accepting whatever
          # key answers would let an impostor report a deploy that never
          # happened. deploy/README.md covers producing this secret.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: deploy
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          # The far side never runs this string: the forced command in
          # authorized_keys runs deploy.sh, which reads it from
          # SSH_ORIGINAL_COMMAND. IdentitiesOnly so an agent cannot offer some
          # other key and change who is connecting.
          ssh -i ~/.ssh/babel_deploy \
              -p "$SSH_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              "$SSH_USER@$SSH_HOST" "deploy $SHA"

      # The second health check. deploy.sh already verified 127.0.0.1; this
      # one goes through nginx and the subpath's prefix-stripping proxy_pass,
      # the only check that sees a broken reverse proxy in front of a working
      # server.
      - name: verify it from outside
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          SHA: ${{ steps.target.outputs.sha }}
        run: node deploy/health-check.mjs "${PUBLIC_URL%/}/api/health" "$SHA" --timeout=60

      - name: summary
        if: always()
        env:
          SHA: ${{ steps.target.outputs.sha }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### deploy: $RESULT"
            echo
            echo "- commit: \`$SHA\`"
            echo "- url: $PUBLIC_URL"
            if [[ "$RESULT" != "success" ]]; then
              echo
              echo "The service was **not** rolled back. Pick the last good sha and"
              echo "re-run this workflow with it, or see \`deploy/README.md\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
