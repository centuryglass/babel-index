name: ci

# Runs on every pull request to main, and on main itself so a green branch is
# always attributable to a commit rather than to a merge nobody re-checked.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, the current LTS, and the
        # release after it - the tile geometry and the map layout are exact
        # arithmetic, so a version that disagrees is worth hearing about.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Playwright is a devDependency for the manual e2e workflow only. This
      # job never opens a browser, so it must not spend a minute downloading
      # one on every run.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: npm test
        run: npm test

  # The browser smoke test, called rather than duplicated so `e2e.yml` stays the
  # one definition of how it runs and keeps its own manual dispatch. One Node
  # version is enough here: this job is about the browser, and the arithmetic
  # that actually varies by runtime is covered by the matrix above.
  e2e:
    name: browser smoke test
    uses: ./.github/workflows/e2e.yml
    with:
      node: '22'

  # A single check to require for merging, so branch protection does not need
  # updating every time the matrix changes - or every time a job is added.
  ci:
    name: ci
    if: always()
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: needs.test.result != 'success' || needs.e2e.result != 'success'
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          echo "e2e result: ${{ needs.e2e.result }}"
          exit 1
