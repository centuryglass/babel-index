# Reference copy of the babel-index blocks in the VPS's hand-managed nginx
# config (docs/agents/deploy.md, "Deployment and the base path"). It is a
# snippet to diff against, not a drop-in include, and is synced by hand when the
# live config changes; the live file also holds TLS and unrelated vhosts.
#
# Both blocks sit inside the site's `server { listen 443 ssl; ... }` block.

# Redirect bare /babel-index to /babel-index/. Until the page loads and sets
# <base href>, relative urls resolve against the last `/`-terminated segment.
location = /babel-index {
	return 301 https://$host/babel-index/;
}

# The babel-index Express server on :5173. The trailing slash on both the
# location and proxy_pass strips the /babel-index prefix, so Express sees
# "/", "/api/foo", etc. An Express-side mount at the prefix would strip twice.
# X-Forwarded-For is what `--trust-proxy` reads for per-visitor rate limits.
location /babel-index/ {
	proxy_pass		http://localhost:5173/;
	proxy_http_version	1.1;
	proxy_set_header	Host $host;
	proxy_set_header	X-Real-IP $remote_addr;
	proxy_set_header	X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header	X-Forwarded-Proto $scheme;
	proxy_read_timeout	90;
}
