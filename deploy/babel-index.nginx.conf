# Reference copy of the babel-index-relevant blocks from the VPS's
# hand-managed nginx config (see deploy/README.md and AGENTS.md's
# "Deployment and the base path"). The live file has more in it that
# doesn't belong in this repo, so this is a snippet to diff against, not
# a drop-in include - keep it in sync by hand whenever the live config
# changes.
#
# Lives inside the site's `server { listen 443 ssl; ... }` block
# alongside its other locations.

# Send bare /babel-index to /babel-index/ so relative paths resolve.
location = /babel-index {
	return 301 https://$host/babel-index/;
}

# babel-index express server on :5173.
# Trailing slash on proxy_pass strips the /babel-index prefix, so the
# express app sees "/", "/api/foo", etc. and needs no mount path.
location /babel-index/ {
	proxy_pass		http://localhost:5173/;
	proxy_http_version	1.1;
	proxy_set_header	Host $host;
	proxy_set_header	X-Real-IP $remote_addr;
	proxy_set_header	X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header	X-Forwarded-Proto $scheme;
	proxy_read_timeout	90;
}
