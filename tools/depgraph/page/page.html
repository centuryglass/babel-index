<title>Babel Dependency Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root {
  color-scheme: light;
  --ground:      #f4f6f4;
  --surface:     #ffffff;
  --surface-2:   #eceff0;
  --ink:         #101819;
  --ink-2:       #4c5b5c;
  --ink-3:       #7c8b8c;
  --rule:        #dbe1e0;
  --rule-strong: #c2ccca;
  --accent:      #e0632a;
  --accent-ink:  #ffffff;
  --teal:        #0f8ba0;
  --d0: #06333f; --d1: #094c5c; --d2: #0d6a7c; --d3: #0f8ba0;
  --d4: #35a6b6; --d5: #6cc2cc; --d6: #a1d9df; --d7: #cfecef;
  --node-ring:   #ffffff;
  --shadow:      0 1px 2px rgba(16,24,25,.06), 0 8px 24px rgba(16,24,25,.06);
  --font-display: 'Spectral', Georgia, 'Times New Roman', serif;
  --font-ui: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:      #0d1113;
    --surface:     #141a1c;
    --surface-2:   #1d2527;
    --ink:         #eef2f0;
    --ink-2:       #a2b0af;
    --ink-3:       #748281;
    --rule:        #222c2e;
    --rule-strong: #33403f;
    --accent:      #e0632a;
    --accent-ink:  #ffffff;
    --teal:        #35a6b6;
    --d0: #8ee6ee; --d1: #62d0da; --d2: #35a6b6; --d3: #2c8b9a;
    --d4: #24717e; --d5: #1d5763; --d6: #184450; --d7: #14353f;
    --node-ring:   #0d1113;
    --shadow:      0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:      #0d1113;
  --surface:     #141a1c;
  --surface-2:   #1d2527;
  --ink:         #eef2f0;
  --ink-2:       #a2b0af;
  --ink-3:       #748281;
  --rule:        #222c2e;
  --rule-strong: #33403f;
  --accent:      #e0632a;
  --accent-ink:  #ffffff;
  --teal:        #35a6b6;
  --d0: #8ee6ee; --d1: #62d0da; --d2: #35a6b6; --d3: #2c8b9a;
  --d4: #24717e; --d5: #1d5763; --d6: #184450; --d7: #14353f;
  --node-ring:   #0d1113;
  --shadow:      0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

/* ---------- masthead ---------- */
.masthead {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px;
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
}
.wordmark {
  font-family: var(--font-display);
  font-size: 25px; font-weight: 600; letter-spacing: -.015em;
  line-height: 1.1;
}
.wordmark em { font-style: italic; font-weight: 400; color: var(--teal); }
.thesis {
  flex: 1 1 340px; min-width: 0;
  color: var(--ink-2); font-size: 13.5px; max-width: 66ch;
}
.thesis b { color: var(--ink); font-weight: 600; }
.provenance {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .04em;
  color: var(--ink-3); text-transform: uppercase; white-space: nowrap;
}

/* ---------- view tabs ---------- */
.tabs { display: flex; gap: 0; padding: 0 24px; border-bottom: 1px solid var(--rule); background: var(--surface); }
.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  font-family: var(--font-ui); font-size: 13px; font-weight: 500; color: var(--ink-3);
  padding: 11px 2px; margin-right: 26px;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); margin-left: 7px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 288px minmax(0, 1fr); min-height: calc(100vh - 118px); }
.rail {
  border-right: 1px solid var(--rule); background: var(--surface);
  padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 22px;
  max-height: calc(100vh - 118px); overflow-y: auto;
}
.stage { position: relative; background: var(--ground); min-height: 460px; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.dragging { cursor: grabbing; }

/* ---------- rail blocks ---------- */
.block { display: flex; flex-direction: column; gap: 9px; }
.block-title {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
}
.figures { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.figure { background: var(--surface); padding: 9px 10px 10px; }
.figure .v {
  font-family: var(--font-mono); font-size: 19px; font-weight: 500;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.15;
}
.figure .v small { font-size: 11px; color: var(--ink-2); font-weight: 400; margin-left: 1px; }
.figure .k { font-size: 10.5px; color: var(--ink-3); line-height: 1.3; margin-top: 2px; }

.note { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.note code { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink); }

/* legend */
.ramp { display: flex; height: 9px; border: 1px solid var(--rule-strong); }
.ramp span { flex: 1; }
.ramp-ends { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); font-family: var(--font-mono); }
.keys { display: flex; flex-direction: column; gap: 6px; }
.key { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--ink-2); }
.swatch { width: 26px; height: 12px; flex: none; display: grid; place-items: center; }

/* focus list */
.focus-list { display: flex; flex-direction: column; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.focus-item {
  appearance: none; border: 0; cursor: pointer; text-align: left; width: 100%;
  background: var(--surface); font-family: var(--font-ui); color: var(--ink);
  padding: 7px 9px; display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 8px;
}
.focus-item:hover { background: var(--surface-2); }
.focus-item[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.focus-item[aria-pressed="true"] .fi-meta { color: rgba(255,255,255,.82); }
.focus-item .fi-name { font-family: var(--font-mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.focus-item .fi-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* controls */
.control { display: flex; flex-direction: column; gap: 5px; }
.control label { font-size: 12px; color: var(--ink-2); }
input[type="search"], select {
  font-family: var(--font-ui); font-size: 12.5px; color: var(--ink);
  background: var(--ground); border: 1px solid var(--rule-strong); border-radius: 0;
  padding: 6px 8px; width: 100%;
}
.checks { display: flex; flex-direction: column; gap: 7px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.check input { accent-color: var(--accent); margin: 0; }

.btn {
  appearance: none; cursor: pointer; font-family: var(--font-ui); font-size: 12px; font-weight: 500;
  background: var(--surface); color: var(--ink); border: 1px solid var(--rule-strong);
  padding: 7px 11px;
}
.btn:hover { background: var(--surface-2); }
.btn-row { display: flex; gap: 7px; flex-wrap: wrap; }

/* ---------- stage overlays ---------- */
.hint {
  position: absolute; left: 16px; bottom: 14px; z-index: 2;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3);
  letter-spacing: .03em; pointer-events: none;
}
.tooltip {
  position: absolute; z-index: 5; pointer-events: none; max-width: 310px;
  background: var(--surface); border: 1px solid var(--rule-strong);
  box-shadow: var(--shadow); padding: 9px 11px 10px; display: none;
}
.tooltip.on { display: block; }
.tt-name { font-family: var(--font-mono); font-size: 12px; font-weight: 500; word-break: break-all; line-height: 1.35; }
.tt-sub { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); margin-top: 1px; word-break: break-all; }
.tt-rows { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin-top: 7px; font-size: 11.5px; }
.tt-rows dt { color: var(--ink-3); }
.tt-rows dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tt-why { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--ink-2); line-height: 1.4; }
.tt-why b { font-weight: 500; color: var(--ink); font-family: var(--font-mono); font-size: 11px; }

.empty {
  position: absolute; inset: 0; display: none; place-items: center; text-align: center;
  color: var(--ink-3); font-size: 13px; padding: 24px;
}
.empty.on { display: grid; }

/* ---------- table ---------- */
.table-wrap { border-top: 1px solid var(--rule); background: var(--surface); }
.table-head {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 10px 24px; flex-wrap: wrap;
}
.table-scroll { overflow-x: auto; max-height: 420px; overflow-y: auto; border-top: 1px solid var(--rule); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
thead th {
  position: sticky; top: 0; background: var(--surface-2); text-align: left;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-2); font-weight: 700; padding: 7px 14px; white-space: nowrap;
  border-bottom: 1px solid var(--rule-strong); cursor: pointer;
}
thead th[aria-sort="descending"]::after { content: " ↓"; color: var(--accent); }
thead th[aria-sort="ascending"]::after { content: " ↑"; color: var(--accent); }
tbody td { padding: 5px 14px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
tbody tr:hover { background: var(--surface-2); }
td.mono, th.num { font-family: var(--font-mono); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
td.name { font-family: var(--font-mono); white-space: normal; word-break: break-word; min-width: 200px; }
.pill {
  display: inline-block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .04em;
  padding: 1px 5px; border: 1px solid var(--rule-strong); color: var(--ink-2); text-transform: uppercase;
}
.pill.dev { border-color: var(--accent); color: var(--accent); }

/* ---------- footer ---------- */
.colophon {
  padding: 20px 24px 34px; border-top: 1px solid var(--rule);
  color: var(--ink-3); font-size: 12px; max-width: 78ch; line-height: 1.55;
}
.colophon code { font-family: var(--font-mono); font-size: 11.5px; }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

@media (max-width: 880px) {
  .shell { grid-template-columns: 1fr; }
  .rail { max-height: none; border-right: 0; border-bottom: 1px solid var(--rule); }
  .stage { height: 62vh; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>

<header class="masthead">
  <h1 class="wordmark">Babel Dependency <em>Atlas</em></h1>
  <p class="thesis" id="thesis"></p>
  <p class="provenance" id="provenance">measured from the tree on disk</p>
</header>

<div class="tabs" role="tablist" aria-label="Which graph to show">
  <button class="tab" role="tab" id="tab-npm" aria-controls="stage" aria-selected="true" data-view="npm">
    The npm chain <span class="count" id="tabc-npm"></span>
  </button>
  <button class="tab" role="tab" id="tab-internal" aria-controls="stage" aria-selected="false" data-view="internal">
    Modules in the repo <span class="count" id="tabc-internal"></span>
  </button>
</div>

<div class="shell">
  <aside class="rail">
    <section class="block">
      <h2 class="block-title" id="fig-title">By the numbers</h2>
      <div class="figures" id="figures" aria-labelledby="fig-title"></div>
    </section>

    <section class="block">
      <h2 class="block-title">Reading the map</h2>
      <div class="ramp" id="ramp" role="img" aria-label="Colour ramp: darker teal is nearer the root, paler teal is deeper in the chain"></div>
      <div class="ramp-ends"><span id="ramp-lo"></span><span id="ramp-hi"></span></div>
      <div class="keys" id="keys"></div>
      <p class="note" id="encoding-note"></p>
    </section>

    <section class="block">
      <h2 class="block-title" id="focus-title">Trace a subtree</h2>
      <p class="note" id="focus-note"></p>
      <div class="focus-list" id="focus-list" aria-labelledby="focus-title"></div>
    </section>

    <section class="block">
      <h2 class="block-title">Filter</h2>
      <div class="control">
        <label for="search">Find by name</label>
        <input type="search" id="search" placeholder="onnxruntime, camera.js…" autocomplete="off">
      </div>
      <div class="checks" id="checks"></div>
      <div class="btn-row">
        <button class="btn" id="reset">Reset view</button>
        <button class="btn" id="reheat">Shake the graph</button>
      </div>
    </section>
  </aside>

  <div class="stage" id="stage" role="tabpanel" aria-labelledby="tab-npm">
    <canvas id="canvas" tabindex="0" role="img" aria-labelledby="canvas-alt"></canvas>
    <p class="hint">drag to pan · scroll to zoom · drag a node loose · click to isolate · arrows and +/− when focused</p>
    <div class="tooltip" id="tooltip" role="status" aria-live="off"></div>
    <div class="empty" id="empty">Nothing matches that filter.</div>
    <p class="visually-hidden" id="canvas-alt"></p>
  </div>
</div>

<section class="table-wrap">
  <div class="table-head">
    <h2 class="block-title" id="table-title">Every node, as a table</h2>
    <p class="note" id="table-note" style="margin:0"></p>
  </div>
  <div class="table-scroll">
    <table aria-labelledby="table-title">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</section>

<footer class="colophon">
  <p id="colophon-text"></p>
</footer>
