<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      No `maximum-scale` and no `user-scalable=no`: blocking page zoom is a
      WCAG 1.4.4 failure, and it locks out the low-vision readers this map is
      hardest on. `style.css`'s `touch-action: none` on `html, body` keeps a
      two-finger map pinch from becoming page zoom instead. iOS gesture
      arbitration needs a real device to confirm; a simulator does not settle
      it.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%%TITLE%%</title>
    <meta name="description" content="%%DESCRIPTION%%" />
    <!-- Every href below is relative, so a subpath deployment resolves it
         under <base href> (see base-path.ts).
         The og:*/twitter:* content urls are the exception. Link unfurlers
         never see <base href>, so app.ts's renderPage fills the canonical-url
         and og-image placeholders with an absolute url for the page being
         served; a /catalog/<slug> permalink gets the room's picture.
         renderPage substitutes placeholder names globally, so spelling one
         inside a comment rewrites the comment too. -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Index of Babel" />
    <meta property="og:title" content="%%TITLE%%" />
    <meta property="og:description" content="%%DESCRIPTION%%" />
    <meta property="og:url" content="%%CANONICAL_URL%%" />
    <meta property="og:image" content="%%OG_IMAGE_URL%%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%%TITLE%%" />
    <meta name="twitter:description" content="%%DESCRIPTION%%" />
    <meta name="twitter:image" content="%%OG_IMAGE_URL%%" />
    <link rel="stylesheet" href="style.css" />
    <!-- Empty except on /map/:slug: a no-JS visitor there gets bounced to
         the identical content at its catalog/:slug url instead of a room
         page with no way to browse onward - see app.ts's renderPage. -->
    %%NOSCRIPT_REDIRECT%%
  </head>
  <body>
    <!-- The body placeholder is crawlable content that app.ts's renderPage
         fills on the catalog, room, /help and /about routes, and leaves
         empty on `/`.
         It sits inside #root so a visitor sees it until main.tsx's
         `createRoot(rootEl).render(<App />)` replaces it on first commit.
         React does not hydrate it; the markup is discarded. -->
    <div id="root">%%SSR_BODY%%</div>
    <!-- The route-script placeholder sets `window.__INITIAL_ROUTE__`, which
         tells main.tsx which mode, room or dialog to open on first render.
         renderPage fills it on the same routes as the body placeholder.
         It must come before bundle.js, which reads it once at module scope. -->
    %%INITIAL_ROUTE_SCRIPT%%
    <script type="module" src="bundle.js"></script>
  </body>
</html>
