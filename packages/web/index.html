<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      No `maximum-scale` and no `user-scalable=no`. Blocking page zoom is a
      WCAG 1.4.4 failure and it locks out exactly the low-vision readers this
      map is hardest on. Those attributes were here to stop iOS treating a
      two-finger map pinch as a page zoom, but that job is actually done by
      `touch-action: none`, set all the way up the tree below - the browser
      decides at touch-start from the computed touch-action of the hit element
      AND its ancestors, so nothing is left claimable. Worth re-checking on a
      real device alongside the in-tile search field (plan §7 item 11); a
      simulator does not settle iOS gesture arbitration.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Index of Babel</title>
    <meta
      name="description"
      content="A pannable, zoomable map of AI-generated library rooms, loosely based on the Library of Babel."
    />
    <!-- Every href below is relative so a subpath deployment resolves it
         under <base href> instead of the browser's own-origin guess, which
         the reverse-proxied prefix never sees - see base-path.ts. The og:*
         and twitter:* content urls are the one exception: link unfurlers
         parse this HTML without ever seeing <base href>, so app.ts fills
         those two placeholders in with an absolute url per request. -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Index of Babel" />
    <meta property="og:title" content="The Index of Babel" />
    <meta
      property="og:description"
      content="A pannable, zoomable map of AI-generated library rooms, loosely based on the Library of Babel."
    />
    <meta property="og:url" content="%%ORIGIN_URL%%" />
    <meta property="og:image" content="%%OG_IMAGE_URL%%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Index of Babel" />
    <meta
      name="twitter:description"
      content="A pannable, zoomable map of AI-generated library rooms, loosely based on the Library of Babel."
    />
    <meta name="twitter:image" content="%%OG_IMAGE_URL%%" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="bundle.js"></script>
  </body>
</html>
