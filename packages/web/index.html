<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      No `maximum-scale` and no `user-scalable=no`. Blocking page zoom is a
      WCAG 1.4.4 failure and it locks out exactly the low-vision readers this
      map is hardest on. Those attributes were here to stop iOS treating a
      two-finger map pinch as a page zoom, but that job is actually done by
      `touch-action: none`, set all the way up the tree below - the browser
      decides at touch-start from the computed touch-action of the hit element
      AND its ancestors, so nothing is left claimable. Worth re-checking on a
      real device alongside the in-tile search field (plan §7 item 11); a
      simulator does not settle iOS gesture arbitration.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Index of Babel</title>
    <!-- Relative so a subpath deployment resolves it under <base href>
         instead of the browser's default same-origin /favicon.ico guess,
         which the reverse-proxied prefix never sees - see base-path.ts. -->
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="bundle.js"></script>
  </body>
</html>
