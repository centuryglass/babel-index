<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      No `maximum-scale` and no `user-scalable=no`. Blocking page zoom is a
      WCAG 1.4.4 failure and it locks out exactly the low-vision readers this
      map is hardest on. Those attributes were here to stop iOS treating a
      two-finger map pinch as a page zoom, but that job is actually done by
      `touch-action: none`, set all the way up the tree below - the browser
      decides at touch-start from the computed touch-action of the hit element
      AND its ancestors, so nothing is left claimable. Worth re-checking on a
      real device alongside the in-tile search field (plan §7 item 11); a
      simulator does not settle iOS gesture arbitration.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Index of Babel</title>
    <!-- Relative so a subpath deployment resolves it under <base href>
         instead of the browser's default same-origin /favicon.ico guess,
         which the reverse-proxied prefix never sees - see base-path.ts. -->
    <link rel="icon" href="favicon.ico" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8e0d2;
        --dim: #9a8f7d;
        --panel: rgba(18, 15, 12, 0.88);
        --edge: rgba(180, 160, 120, 0.22);
        --mismatch: #c97b63;
      }
      * { box-sizing: border-box; }
      /*
       * touch-action and overscroll-behavior are set all the way up, not just on
       * the canvas. The browser decides whether a touch sequence belongs to the
       * page or to itself at touch-start, from the computed touch-action of the
       * hit element AND its ancestors; anything left claimable up the chain lets
       * it take a two-finger gesture for page zoom and send us a pointercancel
       * instead of the pinch.
       */
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #0a0908;
        touch-action: none; overscroll-behavior: none;
      }
      body { font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; color: var(--ink); }
      #root, canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #root { touch-action: none; }
      canvas { display: block; cursor: grab; touch-action: none; }
      canvas.dragging { cursor: grabbing; }

      /*
       * The live search field, anchored to the center tile's traced search
       * box. `main.jsx` drives display/left/top/width/height imperatively
       * from the render loop each frame - `display: none` here is only the
       * pre-first-frame default, never re-asserted by React.
       */
      /*
       * pointer-events: none until focused. Without this, the field is a real
       * DOM element sitting over the canvas by z-order alone, so a pan or
       * pinch whose fingers happen to cross its screen rect at a moment it is
       * visible gets eaten by the input instead of reaching the map - even
       * though nobody meant to touch a text field. It is reachable at all
       * because `goToSearch`'s `.focus()` call is a DOM API, not a pointer
       * event, so pointer-events does not block it; `:focus-within` then
       * opens the field back up so a reader can click inside it to place a
       * cursor once they are actually typing.
       */
      .center-search { position: absolute; display: none; margin: 0; padding: 0; border: none; background: none; pointer-events: none; }
      .center-search:focus-within { pointer-events: auto; }
      .center-search input[type="search"] {
        width: 100%; height: 100%; padding: 0 26px 0 10px; text-align: center;
        background: rgba(10,8,6,0.55); color: var(--ink);
        border: 1px solid rgba(200,169,95,0.45); border-radius: 4px; font: inherit;
      }
      .center-search input[type="search"]:focus { border-color: #c8a95f; background: rgba(10,8,6,0.75); }

      /*
       * The clear-x, shared markup between both search homes (SearchForm.tsx)
       * but sized per home here, same as the input itself. Only mounted while
       * there is something to clear, so no `display` toggle is needed.
       */
      .search-clear {
        position: absolute; top: 50%; right: 4px; transform: translateY(-50%);
        width: 18px; height: 18px; padding: 0; margin: 0; border: none;
        background: none; cursor: pointer; line-height: 0;
      }
      .search-clear svg { width: 100%; height: 100%; display: block; }
      /* The native WebKit clear-x would sit on top of ours and only clear
         the text, not the ranking - suppressed everywhere in favor of it. */
      input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }

      /*
       * The shelf's book buttons, over the center tile's painted spines.
       *
       * Transparent by design: the title is already drawn on the canvas, so a
       * button that painted its own would double it. What these add is
       * everything the pixels cannot have - a name, a focus ring, an activate.
       *
       * pointer-events: none, and unlike `.center-search` there is no
       * `:focus-within` escape hatch: a click on a book already reaches the
       * same `onBook` through the canvas's own tap handling, so opening these
       * up to the pointer would only take gestures away from the map for no
       * behaviour that is not already there.
       *
       * The `button` overrides are against the panel's button styling above,
       * which is a filled, padded, flexed control - none of which belongs on a
       * one-spine-wide sliver. The ring's offset comes in from 2px for the
       * same reason: at a spine's width, 2px reaches across its neighbours.
       */
      .center-books { position: absolute; display: none; pointer-events: none; }
      .center-books button {
        position: absolute; flex: none; margin: 0; padding: 0;
        background: none; border: none; border-radius: 2px;
      }
      .center-books button:hover { background: none; }
      .center-books button:focus-visible { outline-offset: 1px; }
      /*
        The one-time nudge toward the help book (`showHelpHint`, main.tsx) - a
        soft pulse rather than anything that steals focus or blocks input, so
        a reader who ignores it loses nothing. Turned off entirely rather than
        held static under reduced motion: a book that never stops glowing
        reads as broken, not as a hint.
      */
      .center-books button.hint { animation: book-hint 1.8s ease-in-out infinite; }
      @keyframes book-hint {
        0%, 100% { box-shadow: 0 0 0 0 rgba(200,169,95,0.6); }
        50% { box-shadow: 0 0 5px 2px rgba(200,169,95,0.9); }
      }

      /*
       * The open book's hotspot - sized over the WHOLE cell like
       * `.center-books`, not its own box; the highlight is the traced SVG
       * path inside it (`CENTER_BOOK_PATH`), stretched per axis by
       * `viewBox="0 0 1 1"` + `preserveAspectRatio="none"` exactly like the
       * tile image itself, so the highlight is the exact silhouette rather
       * than a rectangle that laps onto the spines either side of it.
       * Positioned and shown/hidden by the same render loop as
       * `.center-books` and for the same reason `pointer-events: none`: a
       * real click already reaches `onTap` -> `centerBookAtPoint` through the
       * canvas, so opening this up to the pointer would only take a gesture
       * away from the map. The `.hover` class is toggled by that render
       * loop's own pointermove listener (useMapRenderer.ts) rather than by
       * CSS `:hover`, which never fires on a `pointer-events: none` element.
       */
      .center-book {
        position: absolute; display: none; margin: 0; padding: 0; border: none;
        background: none; pointer-events: none;
      }
      .center-book svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .center-book path { fill: transparent; stroke: none; }
      .center-book.hover path { fill: rgba(200,169,95,0.28); stroke: rgba(200,169,95,0.55); stroke-width: 0.004; }
      .center-book:focus-visible { outline: 2px solid #c8a95f; outline-offset: 1px; }

      /*
       * The favorites-sort switch and reorder button - one container over
       * the whole cell exactly like `.center-books`, its buttons positioned
       * in percentages from their own traced rects. `pointer-events: none`
       * for the same reason as the shelf: a real click already reaches
       * `onTap` -> `shuffleButtonAtPoint`/`mineToggleAtPoint`/
       * `countToggleAtPoint` through the canvas. The `.hover` class is
       * toggled by the render loop's own pointermove listener
       * (useMapRenderer.ts), same as `.center-book` above, rather than by CSS
       * `:hover`, which never fires on a `pointer-events: none` element -
       * the glow itself is a plain background tint since these buttons paint
       * no text of their own to protect.
       */
      .center-controls { position: absolute; display: none; pointer-events: none; }
      .center-controls button {
        position: absolute; margin: 0; padding: 0; border: none;
        background: none; border-radius: 2px;
      }
      .center-controls button.hover { background: rgba(200,169,95,0.28); box-shadow: 0 0 0 1px rgba(200,169,95,0.55); }
      .center-controls button[aria-pressed="true"] { box-shadow: inset 0 0 0 1px rgba(200,169,95,0.75); }
      .center-controls button:focus-visible { outline: 2px solid #c8a95f; outline-offset: 1px; }
      /*
       * A custom tooltip, not the native `title` popup: the button it is
       * inside has `pointer-events: none` (inherited from `.center-controls`),
       * so a real `mouseover` never reaches it and `title` alone would never
       * show. Shown on the same `.hover` class the render loop's pointermove
       * listener already toggles (useMapRenderer.ts), and on `:focus-visible`
       * so tabbing to the control shows it too, not just a mouse.
       */
      .center-controls .control-tooltip {
        position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
        margin-bottom: 6px; padding: 4px 8px; white-space: nowrap;
        background: var(--panel); border: 1px solid var(--edge); border-radius: 5px;
        color: var(--ink); font-size: 11px; line-height: 1.3;
        opacity: 0; visibility: hidden; transition: opacity 0.1s ease;
      }
      .center-controls button.hover .control-tooltip,
      .center-controls button:focus-visible .control-tooltip {
        opacity: 1; visibility: visible;
      }

      /*
       * The on-tile favorite badge's tooltip - `.control-tooltip` above sits
       * inside the one fixed button it labels, but a badge is painted onto
       * EVERY tile on the canvas and has no per-tile DOM button to anchor
       * one to. One floating element instead, positioned at the pointer by
       * the render loop's own `pointermove` listener (useMapRenderer.ts,
       * alongside `hoveredFavorite`) rather than tied to any element's box.
       * `display: none` is the hidden default; the listener sets `block`
       * only while the pointer is over a badge's traced silhouette.
       */
      .favorite-tooltip {
        position: absolute; display: none; pointer-events: none; z-index: 2;
        transform: translate(-50%, -100%); margin-top: -8px;
        padding: 4px 8px; white-space: nowrap;
        background: var(--panel); border: 1px solid var(--edge); border-radius: 5px;
        color: var(--ink); font-size: 11px; line-height: 1.3;
      }

      .panel {
        position: absolute; top: 16px; left: 16px; width: 268px; padding: 14px 16px;
        background: var(--panel); border: 1px solid var(--edge); border-radius: 8px;
        backdrop-filter: blur(8px);
      }
      .panel h1 { margin: 0 0 2px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
      .panel .sub { margin: 0 0 14px; color: var(--dim); font-size: 11px; }
      .row { margin-bottom: 12px; }
      .row label { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-bottom: 4px; }
      .row label b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
      input[type="range"] { width: 100%; accent-color: #c8a95f; }
      input[type="search"] {
        width: 100%; padding: 7px 9px; background: rgba(0,0,0,0.4); color: var(--ink);
        border: 1px solid var(--edge); border-radius: 5px; font: inherit;
      }
      input[type="search"]:focus { border-color: #c8a95f; }
      /*
       * One focus ring for everything, and it must stay visible. The search
       * fields used to say `outline: none` and lean on a border-colour shift
       * instead - a one-pixel hue change is not an indicator, and it is the
       * kind that disappears entirely against the panel at low contrast. The
       * offset is what keeps the ring off the control's own border so the two
       * do not read as one thicker edge.
       *
       * `:focus-visible` rather than `:focus` so a mouse click on a button does
       * not leave a ring behind, which is the reason `outline: none` gets
       * reached for in the first place.
       */
      :focus-visible {
        outline: 2px solid #c8a95f;
        outline-offset: 2px;
      }

      /*
       * Present to assistive technology, absent to the eye. `display: none` and
       * `visibility: hidden` both drop the node out of the accessibility tree
       * along with the pixels, which is the opposite of what this is for.
       */
      .sr-only {
        position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
        overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
      }

      /* The ranked listbox: a search's lossless reading, next to the map's lossy spatial one. */
      .results-list {
        list-style: none; margin: 0; padding: 0;
        max-height: 220px; overflow-y: auto;
      }
      .results-list li + li { margin-top: 3px; }
      .result {
        display: block; width: 100%; text-align: left; padding: 5px 8px;
        background: rgba(200,169,95,0.08); color: var(--ink);
        border: 1px solid var(--edge); border-radius: 4px; font: inherit; font-size: 11px;
        line-height: 1.4; cursor: pointer;
      }
      .result:hover { background: rgba(200,169,95,0.2); }

      .buttons { display: flex; gap: 7px; }
      /*
        `flex: 1` here is for the dev panel's button ROWS, where the buttons
        share the width evenly - but this selector is every button in the
        document, so anything else that puts buttons in a flex container gets it
        too. That is the same trap `.row` was; the catalog opts out explicitly
        below rather than this being narrowed under the panel it was written for.
      */
      button {
        flex: 1; padding: 6px 8px; background: rgba(200,169,95,0.12); color: var(--ink);
        border: 1px solid var(--edge); border-radius: 5px; font: inherit; cursor: pointer;
      }
      button:hover { background: rgba(200,169,95,0.24); }
      .search-trigger { width: 100%; }
      /*
        The map's own search affordance - not part of the panel, so it has to
        exist and be positioned without one. Same corner the panel used to put
        its trigger in (top-left), but a standalone circular badge rather than
        a full-width panel row, which is why this comes after `.search-trigger`
        and overrides its `width: 100%`.
      */
      .search-icon-button {
        position: absolute; top: 16px; left: 16px; width: 56px; height: 56px; z-index: 1;
        padding: 0; border: none; background: none; border-radius: 50%; cursor: pointer;
      }
      .search-icon-button:hover .search-icon-glyph { filter: brightness(1.15); }
      /*
        These are `<span>`s wrapping raw, injected SVG markup (see
        SearchIcon.tsx) rather than `<svg>` elements themselves, so the size
        has to be asserted twice: on the span, positioning it over the badge,
        and on the nested `svg` the traced file declares, overriding its own
        `width`/`height` (Inkscape writes those in mm) which would otherwise
        win over a span sized around it.
      */
      .search-icon-glyph, .search-icon-arrow {
        position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
      }
      .search-icon-glyph svg, .search-icon-arrow svg { display: block; width: 100%; height: 100%; }
      /*
        The arrow is a separate layer over the same badge, rotated around the
        badge's own center rather than baked into a single traced shape - see
        `SearchIcon.tsx`. `useMapRenderer` writes its `transform` every frame
        from the live camera, so it always points at wherever the center tile
        currently is on screen; no default rotation here to fight that.
      */
      .search-icon-arrow { transform-origin: 50% 50%; }
      .note { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--edge); color: var(--dim); font-size: 11px; }
      .hud {
        position: absolute; bottom: 14px; left: 16px; color: var(--dim); font-size: 11px;
        font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000;
      }

      /* ?touchdebug only: the raw pointer stream, readable from the device. */
      .touchlog {
        position: absolute; right: 8px; bottom: 8px; max-width: 60vw;
        padding: 6px 8px; white-space: pre; pointer-events: none;
        font: 10px/1.35 ui-monospace, monospace; color: var(--dim);
        background: rgba(0,0,0,0.6); border-radius: 6px;
      }

      /*
        The dialog chrome shared by `RoomOverlay`, `HelpDialog`,
        `ArtistStatementOverlay` and `BabelBookOverlay` - the scrim/dialog
        pair is each one's own (`.overlay-scrim`/`.overlay` below), but the
        head row inside it is one appearance.
      */
      .card-head {
        display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
        margin-bottom: 9px; padding-bottom: 8px; border-bottom: 1px solid var(--edge);
        flex: none;
      }
      .card-id { color: var(--dim); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
      .card-id b { font-weight: 700; color: var(--ink); }
      .card-close {
        flex: none; width: 20px; height: 20px; padding: 0; line-height: 1;
        font-size: 15px; color: var(--dim); background: none; border: none; cursor: pointer;
      }
      .card-close:hover { color: var(--ink); background: none; }
      /*
        The favorite control, in the overlay and in a catalog row's head - one
        appearance in both, since the thing it reports (this room's global
        count) is the same fact wherever it is met. The filled star is
        `aria-hidden`; `aria-pressed` and the label are what a reader
        actually hears.
      */
      .favorite { display: flex; margin-bottom: 8px; }
      .catalog-name .favorite { margin: 0; }
      /*
        The overlay's own row for the favorite toggle and the other reading's
        link ("show on the map" / "show in the catalog") - `space-between` so
        the link sits right-aligned against the toggle without either control
        needing to know the other is there. Nested `.favorite` drops its own
        margin since this row already carries one.
      */
      /*
        `margin-left: auto` on the link rather than `justify-content:
        space-between` - the favorite toggle is absent for a generic cell, and
        `space-between` with one child left-aligns it instead of right.
      */
      .overlay-actions { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .overlay-actions .favorite { margin-bottom: 0; }
      .overlay-actions .catalog-show { margin-left: auto; }
      .favorite-toggle {
        flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px;
        padding: 3px 9px; font: inherit; font-size: 11px; cursor: pointer;
        color: var(--dim); background: rgba(200,169,95,0.08);
        border: 1px solid var(--edge); border-radius: 999px;
      }
      .favorite-toggle:hover { color: var(--ink); background: rgba(200,169,95,0.22); border-color: #c8a95f; }
      .favorite-toggle.on { color: #c8a95f; background: rgba(200,169,95,0.24); border-color: #c8a95f; }
      .favorite-count { font-variant-numeric: tabular-nums; }
      /*
        Sized to its own text, like every other catalog-bar control - the
        panel's `button { flex: 1 }` would otherwise stretch the select across
        the row.
      */
      .catalog-sort {
        flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px;
        color: var(--dim); font-size: 11px;
      }
      .catalog-sort select {
        font: inherit; font-size: 11px; color: var(--ink); cursor: pointer;
        background: rgba(200,169,95,0.08); border: 1px solid var(--edge);
        border-radius: 4px; padding: 3px 6px;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
      .chip {
        flex: 0 0 auto; padding: 3px 8px; font-size: 11px;
        background: rgba(200,169,95,0.14); border: 1px solid var(--edge); border-radius: 999px;
        color: var(--ink); cursor: pointer;
      }
      .chip:hover { background: rgba(200,169,95,0.3); border-color: #c8a95f; }
      /*
        A chip with a recorded external link grows a second, narrower pill
        fused to it - the search action and "read more about this" stay two
        separate controls (one is a button, one is a link that leaves the
        page) rather than one guessing which the reader meant.
      */
      .chip-group { display: inline-flex; }
      .chip-group .chip { border-radius: 999px 0 0 999px; border-right: none; }
      .chip-link {
        flex: 0 0 auto; display: flex; align-items: center; padding: 3px 6px;
        font-size: 10px; line-height: 1; text-decoration: none;
        background: rgba(200,169,95,0.14); border: 1px solid var(--edge);
        border-radius: 0 999px 999px 0; color: var(--dim);
      }
      .chip-link:hover { background: rgba(200,169,95,0.3); border-color: #c8a95f; color: var(--ink); }
      .story { margin: 0; font-size: 12px; line-height: 1.55; color: var(--ink); }
      /*
        A match, marked where it matched. Deliberately a wash of the accent
        rather than a block fill: a story with six hits in it should still read
        as prose, and a solid highlight turns it into a ransom note. `<mark>`'s
        UA default is a yellow block on black text, which is unreadable on this
        palette, so both colours are restated.
      */
      mark {
        background: rgba(200,169,95,0.26); color: var(--ink);
        border-radius: 2px; padding: 0 1px;
        box-shadow: 0 0 0 1px rgba(200,169,95,0.35);
      }
      .chip mark { background: rgba(200,169,95,0.45); box-shadow: none; }

      /*
        Why a room ranked where it did - see RoomDetails' ScoreBreakdown. One
        short line per axis that found something, not a table: the composite
        line's tooltip (tap-and-hold on mobile) carries the per-signal
        percentage breakdown, so nothing here restates it as a second row.
      */
      .score { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--edge); font-size: 11px; color: var(--dim); }
      .score p { margin: 2px 0; font-variant-numeric: tabular-nums; }
      .score .score-composite { color: var(--ink); font-weight: 500; }
      /*
        docs/search_rules.md "Reporting": a negative reading is evidence of a
        mismatch, not a bare minus sign, so it gets a visually distinct style -
        a different color plus italics - never confused with a positive match.
      */
      .clip-certainty { color: var(--dim); }
      .clip-certainty.mismatch { color: var(--mismatch); font-style: italic; }
      /*
        Set apart from the sum above it on purpose: every row in that sum is
        relative to this query's corpus, and this one is measured against
        absolute bounds. Reading it as another term would be reading it wrong.
      */
      .score .sure th, .score .sure td { color: var(--dim); font-style: italic; }
      .forget { width: 100%; }

      /*
        The map's wrapper. `display: contents` generates no box at all, so the
        canvas and the two center-tile overlays keep positioning against #root
        exactly as they did before there was a wrapper - wrapping must cost
        nothing, or every imperative rect in the render loop shifts. `[hidden]`
        has to be restated because the class would otherwise win on specificity
        over the UA's `[hidden] { display: none }`.
      */
      .map-view { display: contents; }
      .map-view[hidden] { display: none; }

      /* One live region for the whole app, visually hidden, never unmounted. */
      .live {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
      }

      /* --- the catalog ------------------------------------------------- */

      .catalog {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        background: #0a0908; touch-action: auto;
        animation: catalog-in 240ms ease both;
      }
      /*
        The cross-fade half of the transition. The FLIP on the first row's
        thumbnail is driven from main.jsx; this is what the REST of the list
        does, and it is what the whole transition degrades to when the center
        tile was off screen.
      */
      @keyframes catalog-in { from { opacity: 0; } to { opacity: 1; } }
      .catalog.leaving { animation: catalog-out var(--catalog-out, 380ms) ease both; }
      @keyframes catalog-out { from { opacity: 1; } to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .catalog, .catalog.leaving { animation: none; }
        .center-books button.hint { animation: none; }
      }

      .catalog-bar {
        flex: 0 0 auto; padding: 10px 16px; background: var(--panel);
        border-bottom: 1px solid var(--edge); backdrop-filter: blur(6px);
      }
      .catalog-bar-row { display: flex; gap: 10px; align-items: center; }
      /*
        The bar names the query IN FULL - the shelf link that repeats it is
        ellipsised to a column, so this is where a reader confirms what was
        actually searched for. Bounded by `search.maxQueryLength`, and allowed
        to wrap rather than to push the paging control off the edge.
      */
      .catalog-bar-row.sub { flex-wrap: wrap; align-items: flex-start; }
      .catalog-count { overflow-wrap: anywhere; }
      .catalog-bar-row.sub { margin-top: 8px; }
      .catalog-search { position: relative; flex: 1; margin: 0; }
      .catalog-search input[type="search"] {
        width: 100%; padding: 7px 28px 7px 10px; font: inherit; color: var(--ink);
        background: rgba(10,8,6,0.6); border: 1px solid var(--edge); border-radius: 4px;
      }
      .catalog-search input[type="search"]:focus { border-color: #c8a95f; outline: none; }
      .catalog-search .search-clear { right: 8px; width: 16px; height: 16px; }
      .catalog-count { margin: 0; flex: 1 1 16em; color: var(--dim); font-size: 11px; }
      .catalog-count b { color: var(--ink); font-variant-numeric: tabular-nums; }
      .catalog-note { color: var(--dim); }

      .paging { display: flex; gap: 4px; }
      /*
        Sized to their own text, against the global `button { flex: 1 }` above -
        which stretched the pager's two buttons across half the window each and
        the top bar's toggle across everything the search box left.
      */
      .catalog .mode-toggle, .paging button, .pager button { flex: 0 0 auto; }
      .paging button, .mode-toggle, .catalog-show, .pager button {
        font: inherit; font-size: 11px; color: var(--dim); cursor: pointer;
        background: rgba(200,169,95,0.08); border: 1px solid var(--edge);
        border-radius: 4px; padding: 4px 9px;
      }
      .paging button.on { color: var(--ink); background: rgba(200,169,95,0.24); border-color: #c8a95f; }
      .mode-toggle { color: var(--ink); }
      /*
        The panel's `.forget { width: 100% }` is sized for its own block-layout
        `.buttons` row; the catalog bar is flex, so it needs the same
        sized-to-its-own-text override as `.mode-toggle` above or it stretches
        across the row and shoves the toggle onto the next line.
      */
      .catalog .forget {
        width: auto; flex: 0 0 auto; font: inherit; font-size: 11px; color: var(--dim);
        cursor: pointer; background: rgba(200,169,95,0.08); border: 1px solid var(--edge);
        border-radius: 4px; padding: 4px 9px;
      }

      .catalog-scroll { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; }
      .catalog-list { list-style: none; margin: 0; padding: 0; }

      /*
        Every row is exactly `--catalog-row` tall, and that is load-bearing
        rather than cosmetic: the spacers standing in for unmounted pages are
        computed from it, so a row that grew with its story would make them a
        guess and the scroll position would jump on every recycle. The story is
        clamped to fit; the whole of it is in the room card.
      */
      /*
        Namespaced, and that is not tidiness: the dev panel has had a `.row`
        class since before this file did, and an unprefixed rule here reached
        into it and turned every slider row into a flex box of fixed height.
        Shared classes are the ones that are shared ON PURPOSE - `.chips`,
        `.story`, `.score` all come from RoomDetails and must look the same in a
        card and in a row.
      */
      .catalog-row {
        display: flex; gap: 14px; align-items: flex-start;
        height: var(--catalog-row); padding: 11px 16px;
        border-bottom: 1px solid var(--edge); overflow: hidden;
      }
      /*
        "Show in the catalog" (`RoomOverlay`'s view toggle) lands a reader on a
        row that otherwise looks like any other - this is what actually picks
        it out. A background pulse rather than a border: a border shifts
        layout by its own width unless every row reserves it unused, and this
        is transient by design (`SPOTLIGHT_MS`, `CatalogView.tsx`) rather than
        a standing marker that would want a permanent outline.
      */
      .catalog-row.spotlight { animation: catalog-spotlight 1.6s ease-out; }
      @keyframes catalog-spotlight {
        0% { background: rgba(200,169,95,0.32); }
        100% { background: transparent; }
      }
      /*
        The tile is a BUTTON - pressing it enlarges the room. A bare <img> with a
        click handler is unreachable by keyboard and announces as an image
        rather than as a control.
      */
      .catalog-tile-button {
        flex: 0 0 auto; padding: 0; border: none; background: none;
        cursor: zoom-in; line-height: 0; border-radius: 2px;
      }
      .catalog-tile-button:focus-visible { outline: 2px solid #c8a95f; outline-offset: 2px; }
      .catalog-tile {
        display: block; width: var(--catalog-thumb); height: auto;
        border-radius: 2px; background: #14110d; transform-origin: 0 0;
      }
      /*
        Only the center row's thumbnail wraps its tile - it is the one room
        whose art carries an addressable hotspot (the open book), so it is the
        one thumbnail that needs a positioning parent at all.
      */
      .catalog-tile-wrap { position: relative; flex: 0 0 auto; line-height: 0; }
      /*
        The open book's hotspot on the catalog's small thumbnail, filling the
        whole thumbnail - the traced SVG path inside it is the actual
        highlight shape, stretched per axis exactly like the map's own
        `.center-book`. A real `:hover`/`:focus-visible` works here (unlike
        the map) because this sits in an ordinary scrolling list, not over the
        gesture-owning canvas - there is no pan to protect from a stray
        pointerdown.
      */
      .catalog-center-book {
        position: absolute; inset: 0; margin: 0; padding: 0; border: none;
        background: none; cursor: pointer; width: 100%; height: 100%;
      }
      .catalog-center-book svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .catalog-center-book path { fill: transparent; stroke: none; }
      .catalog-center-book:hover path { fill: rgba(200,169,95,0.28); stroke: rgba(200,169,95,0.55); stroke-width: 0.004; }
      .catalog-center-book:focus-visible { outline: 2px solid #c8a95f; outline-offset: 1px; }
      /* Shown only on a story the clamp actually cut - see CatalogRow. */
      .catalog-more {
        font: inherit; font-size: 10px; color: #c8a95f; cursor: pointer;
        background: none; border: none; padding: 2px 0; text-decoration: underline;
      }

      /* --- one room, as large as the display allows -------------------- */

      .overlay-scrim {
        position: fixed; inset: 0; z-index: 20; display: flex;
        align-items: center; justify-content: center; padding: 24px;
        background: rgba(6,5,4,0.82); overflow-y: auto; touch-action: auto;
      }
      /*
        Wide enough for the tile at its native resolution (1024px, `BASE_TILE`)
        plus the padding/border around it - a viewport that size or larger
        shows the picture at full size, a smaller one shrinks it
        (`.overlay-tile` below). Everything inside - tile and story alike -
        scrolls as this one region: a long story and a native-resolution
        picture compete for the same space rather than each getting a fixed
        share.
      */
      .overlay {
        width: min(1060px, 100%); max-height: 100%; overflow-y: auto;
        background: var(--panel); border: 1px solid var(--edge); border-radius: 6px;
        padding: 14px 16px 16px;
      }
      .overlay:focus { outline: none; }
      /*
        Sized to its own native resolution by default: `width: auto` with
        `max-width: 100%` never blows it up past that, only shrinking it to
        fit a narrower dialog - the same rule the map's opening view follows.
      */
      .overlay-tile {
        display: block; width: auto; max-width: 100%; height: auto;
        margin: 4px auto 14px; border-radius: 3px; background: #14110d;
      }
      /*
        Nothing clipped here: this is where the whole story lives. Redundant
        today, because the clamp is scoped to `.catalog-row` - and kept because
        it is the second of two independent things holding that property, and
        the e2e assertion only fails when BOTH are gone. Losing one silently is
        exactly what this is for.
      */
      .overlay-body .story { display: block; overflow: visible; white-space: pre-line; }

      /* The help dialog reuses .overlay/.card-head; only the prose is its own. */
      .help-overlay { width: min(520px, 100%); }
      /*
        `.card-id` is `--dim` everywhere else because it sits beside a room's
        own title there - here it IS the dialog's title, with nothing brighter
        on the line to defer to, so it takes `--ink` instead. Scoped to this
        overlay rather than changed at the source: `.card-id` still needs to
        read as secondary next to a room's title in `RoomOverlay`.
      */
      .help-overlay .card-id { color: var(--ink); }
      .help-body p { margin: 0 0 10px; font-size: 12px; line-height: 1.55; color: var(--ink); }
      .help-body p:last-child { margin-bottom: 0; }
      .help-keys {
        display: grid; grid-template-columns: auto 1fr; column-gap: 12px; row-gap: 6px;
        margin: 0 0 10px; font-size: 12px; line-height: 1.4;
      }
      .help-keys dt { color: var(--ink); font-weight: 600; white-space: nowrap; }
      .help-keys dd { margin: 0; color: var(--dim); }
      /*
        Landscape gets a wider dialog laid out in two CSS columns instead of
        one long scroll - the "giant pillar of text" a plain-language rewrite
        produces once it says everything a diegetic hint used to leave
        implicit. Gated on both orientation and a minimum width rather than
        orientation alone, so a narrow landscape phone still gets one column
        instead of two columns too thin to read. `column-fill` stays at its
        `balance` default, so `break-inside: avoid` on each paragraph/group is
        what keeps a block from splitting across the two, not manual placement -
        there is no per-paragraph column assignment to keep in sync as the copy
        changes.
      */
      @media (orientation: landscape) and (min-width: 560px) {
        .help-overlay { width: min(820px, 94vw); }
        .help-body { columns: 2; column-gap: 28px; column-rule: 1px solid var(--edge); }
        .help-body p, .help-keys-group { break-inside: avoid; }
      }
      /*
        Collapsed by default (see HelpDialog.tsx) - a reader who never opens
        this should see one quiet line, not a checklist. `summary` gets its
        own focus ring because a native `<details>` disclosure triangle is
        otherwise the only visual cue that it is interactive at all.
      */
      .help-block-panel { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--edge); }
      .help-block-panel summary {
        font-size: 11px; color: var(--ink); letter-spacing: 0.04em;
        text-transform: uppercase; cursor: pointer;
      }
      .help-block-panel summary:focus-visible { outline: 2px solid #c8a95f; outline-offset: 2px; }
      .help-block-panel[open] summary { margin-bottom: 8px; }
      .help-block-note { margin: 0 0 8px; font-size: 11px; line-height: 1.5; color: var(--dim); }
      .help-block-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; }
      .help-block-list label {
        display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink); cursor: pointer;
      }
      .catalog-body { flex: 1 1 auto; min-width: 0; overflow: hidden; }
      /*
        The room's identity and the way out to the map share one row, with real
        space under it. They used to be at opposite ends of the row with the
        keyword chips in between, which put a link and a row of tags a thumb's
        width apart.
      */
      .catalog-head {
        display: flex; align-items: baseline;
        gap: 12px; margin-bottom: 9px;
      }
      .catalog-name {
        margin: 0; font-size: 12px; font-weight: 500; color: var(--ink);
        display: flex; align-items: baseline; gap: 8px; min-width: 0;
        flex: 1 1 auto;
        /* One line: "Room 25" breaking in two pushed the whole row down. */
        white-space: nowrap; overflow: hidden;
      }
      .catalog-show { flex: 0 0 auto; }
      .catalog-name .favorite-toggle { flex: 0 0 auto; }
      .catalog-rank {
        color: #c8a95f; font-variant-numeric: tabular-nums; font-size: 11px;
        min-width: 2.2em;
      }
      .catalog-sub { margin: 0 0 7px; color: var(--dim); font-size: 11px; }
      /*
        The clamp is a variable, not a literal: how many lines fit depends on
        the row's height, which depends on the thumbnail's width, which depends
        on the display. Two lines flat cut stories off with visible empty space
        under them on anything wide. See `storyLines`.
      */
      .catalog-row .story {
        display: -webkit-box; -webkit-line-clamp: var(--catalog-lines, 2);
        -webkit-box-orient: vertical; line-height: var(--catalog-line, 19px);
        overflow: hidden; margin-bottom: 5px;
      }
      /*
        Two lines at most, matching what STORY_RESERVED_PX sets aside. A room
        with six keywords on a narrow display would otherwise push the story out
        of a row that cannot grow.
      */
      .catalog-row .chips {
        margin-bottom: 5px; max-height: 48px; overflow: hidden; align-content: flex-start;
      }
      /*
        The score, as up to four SHORT lines (composite, tag, story, clip) -
        `CatalogView.tsx`'s `SCORE_STRIP_PX` reserves room for all four on
        every row, whether or not this room's own search found that many, so
        every row stays exactly as tall as every other - what the sliding
        window's spacers are computed from. Each line never wraps and clips
        with an ellipsis rather than growing a second visual line, which is
        what would actually break that uniform height.
      */
      .score-strip { margin: 6px 0 0; padding: 6px 0 0; border-top: 1px solid var(--edge); font-size: 10px; color: var(--dim); }
      .score-strip p {
        margin: 1px 0; font-variant-numeric: tabular-nums;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .score-strip .score-composite { color: var(--ink); font-weight: 500; }
      .score-strip .clip-certainty { color: #8a7c66; }
      .score-strip .clip-certainty.mismatch { color: var(--mismatch); font-style: italic; }
      .catalog-show.dim { border: none; background: none; padding: 4px 0; font-style: italic; }

      /* The center room's row: the shelf, as links. */
      /*
        The one row that sizes itself. Forty shelf titles wrap to as many lines
        as the width needs, and cropping them to a tile's height would hide the
        newest searches - which are the whole reason the wall is a record. Safe
        because this row is not a PAGED one: the spacers stand in for those, and
        the scroll arithmetic takes this row's measured height as its lead.
      */
      .catalog-center {
        background: rgba(200,169,95,0.04);
        height: auto; min-height: var(--catalog-row); align-items: flex-start;
      }
      /*
        A GRID of equal cells, not a wrapped row of pills sized to their own
        text. Forty tags at forty different widths read as rubble; the wall this
        stands for is a grid of identical spines, and the column width comes
        from the longest title actually on it (`shelfColumnCh`) so the shape is
        the dataset's rather than a guess.
      */
      .shelf-links {
        display: grid; align-content: start; gap: 4px;
        /*
          `min(..., 48%)` guarantees at least two columns however narrow the
          display: without it a phone gets one column of forty rows, which is a
          thousand pixels of shelf before the first room. The titles ellipsise,
          so a narrow column costs some text, not the layout.
        */
        grid-template-columns: repeat(auto-fill, minmax(min(var(--shelf-col, 12ch), 48%), 1fr));
        /*
          And the wall is capped rather than allowed to set the row's height.
          On anything wide this is well under the cap and never scrolls; on a
          phone it is what keeps the center room from being the whole page.
        */
        max-height: 42vh; overflow-y: auto; overscroll-behavior: contain;
      }
      .shelf-link {
        font: inherit; font-size: 10px; cursor: pointer; padding: 3px 6px;
        border-radius: 3px; border: 1px solid transparent;
        background: rgba(200,169,95,0.08); color: var(--dim);
        /* One line, ellipsised - a long search term must not set the row's height. */
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        text-align: left;
      }
      .shelf-link.history { color: var(--ink); border-color: var(--edge); }
      /*
        An override does something other than search, so it must not look like
        the tags around it. Underlined for now - a placeholder for whatever the
        font/text pass decides, but the distinction has to be visible before
        then, not only in the colour.
      */
      .shelf-link.override { color: #c8a95f; border-color: #c8a95f; text-decoration: underline; }
      .shelf-link:hover { background: rgba(200,169,95,0.22); }

      .catalog-spacer { padding: 0; border: none; }
      .pager {
        display: flex; gap: 12px; align-items: center; justify-content: center;
        padding: 14px; color: var(--dim); font-size: 11px;
      }
      .pager b { color: var(--ink); font-variant-numeric: tabular-nums; }
      .pager button[disabled] { opacity: 0.35; cursor: default; }
      .story.dim { color: var(--dim); font-style: italic; }
      /*
       * The sidecar's optional caption, rendered only inside the map canvas's
       * fallback content (`RoomDetails`'s `showPicture` prop) - fallback
       * content is never painted, so nothing here is actually seen; this
       * styling only matters if a browser without canvas support ever renders
       * it for real. Every other consumer puts the same text on an `<img
       * alt>` instead.
       */
      .picture {
        margin: 0 0 8px; padding-left: 8px; font-size: 11.5px; line-height: 1.5;
        color: var(--dim); border-left: 2px solid var(--edge);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="bundle.js"></script>
  </body>
</html>
